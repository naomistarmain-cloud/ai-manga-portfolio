<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜が消される街 ― 深夜の配達人</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --panel: rgba(20, 20, 20, 0.88);
      --text: #f7f4ee;
      --muted: #b9b1a5;
      --line: rgba(255, 255, 255, 0.16);
      --accent: #d8b46a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 54px;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.86), rgba(0, 0, 0, 0.42), transparent);
      pointer-events: none;
    }

    .back {
      pointer-events: auto;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }

    .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    .counter {
      flex: 0 0 auto;
      min-width: 72px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      pointer-events: auto;
    }

    .viewer {
      height: 100dvh;
      display: flex;
      flex-direction: row-reverse;
      gap: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: auto;
      padding: 64px 0 34px;
      scrollbar-color: var(--accent) #27221a;
      scrollbar-width: thin;
    }

    .page {
      flex: 0 0 100%;
      height: calc(100dvh - 112px);
      display: grid;
      place-items: center;
      scroll-snap-align: center;
      scroll-snap-stop: always;
    }

    .page img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #050505;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.52);
      user-select: none;
      -webkit-user-drag: none;
    }

    .nav {
      position: fixed;
      inset: auto 0 16px;
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
    }

    button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel);
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
    }

    @media (max-width: 640px) {
      .topbar {
        gap: 8px;
        padding-inline: 10px;
      }

      .back {
        font-size: 12px;
        padding-inline: 8px;
      }

      .title {
        font-size: 12px;
      }
    }
  
    .topbar {padding-top:calc(10px + env(safe-area-inset-top));}
    .viewer {height:100vh;height:100dvh;padding:calc(64px + env(safe-area-inset-top)) 0 calc(76px + env(safe-area-inset-bottom));}
    .page {height:100%;min-width:0;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);}
    .page img {width:100%;height:100%;object-fit:contain;}
    .nav {bottom:calc(16px + env(safe-area-inset-bottom));}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../">一覧</a>
    <div class="title">夜が消される街 ― 深夜の配達人</div>
    <div class="counter" id="counter">1 / 17</div>
  </header>

  <main class="viewer" id="viewer" aria-label="漫画ビューア"></main>

  <nav class="nav" aria-label="ページ移動">
    <button id="prev" type="button" aria-label="次のページ">‹</button>
    <button id="next" type="button" aria-label="前のページ">›</button>
  </nav>

  <script>
    const imageFiles = [
      "pages-small/page_001.jpg",
      "pages-small/page_002.jpg",
      "pages-small/page_003.jpg",
      "pages-small/page_004.jpg",
      "pages-small/page_005.jpg",
      "pages-small/page_006.jpg",
      "pages-small/page_007.jpg",
      "pages-small/page_008.jpg",
      "pages-small/page_009.jpg",
      "pages-small/page_010.jpg",
      "pages-small/page_011.jpg",
      "pages-small/page_012.jpg",
      "pages-small/page_013.jpg",
      "pages-small/page_014.jpg",
      "pages-small/page_015.jpg",
      "pages-small/page_016.jpg",
      "pages-small/page_017.jpg"
];
    history.scrollRestoration = "manual";
    const viewer = document.getElementById("viewer");
    const counter = document.getElementById("counter");
    let currentIndex = 0;

    imageFiles.forEach((fileName, index) => {
      const page = document.createElement("section");
      page.className = "page";
      page.dataset.index = String(index);

      const img = document.createElement("img");
      img.src = encodeURI(fileName);
      img.alt = fileName.replace(/\.[^.]+$/, "");
      img.loading = index < 2 ? "eager" : "lazy";

      page.appendChild(img);
      viewer.appendChild(page);
    });

    function pages() {
      return [...viewer.querySelectorAll(".page")];
    }

    function nearestPageIndex() {
      const bounds = viewer.getBoundingClientRect();
      const center = bounds.left + bounds.width / 2;
      let best = currentIndex;
      let distance = Infinity;

      pages().forEach((page, index) => {
        const rect = page.getBoundingClientRect();
        const pageCenter = rect.left + rect.width / 2;
        const nextDistance = Math.abs(center - pageCenter);
        if (nextDistance < distance) {
          distance = nextDistance;
          best = index;
        }
      });

      return best;
    }

    function updateCounter(index = nearestPageIndex()) {
      currentIndex = index;
      counter.textContent = `${currentIndex + 1} / ${imageFiles.length}`;
    }

    function go(delta) {
      const nextIndex = Math.max(0, Math.min(imageFiles.length - 1, currentIndex + delta));
      pages()[nextIndex].scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      updateCounter(nextIndex);
    }

    document.getElementById("prev").addEventListener("click", () => go(1));
    document.getElementById("next").addEventListener("click", () => go(-1));

    window.addEventListener("keydown", (event) => {
      if (event.key === "Home") go(-imageFiles.length);
      if (event.key === "End") go(imageFiles.length);
      if (event.key === "ArrowLeft") go(1);
      if (event.key === "ArrowRight") go(-1);
    });

    viewer.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        event.preventDefault();
        viewer.scrollLeft -= event.deltaY;
      }
    }, { passive: false });

    viewer.addEventListener("scroll", () => {
      window.requestAnimationFrame(() => updateCounter());
    }, { passive: true });

    window.addEventListener("load", () => {
      pages()[0].scrollIntoView({ behavior: "instant", inline: "center", block: "nearest" });
      updateCounter(0);
    });
  </script>
</body>
</html>
