<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI漫画 作品集</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #f7f4ee;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 750;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }

    .card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #050505;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    .card span {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.45;
    }

    .card small {
      color: #b9b1a5;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI漫画 作品集</h1>
    <section class="grid" aria-label="作品一覧">
      <a class="card" href="010-juurokuzakura-sakura/">
        <img src="010-juurokuzakura-sakura/pages-small/page_001.jpg" alt="十六桜 SAKURA">
        <span>十六桜 SAKURA</span>
        <small>10ページ</small>
      </a>
      <a class="card" href="09-yodaka/">
        <img src="09-yodaka/pages-small/page_001.jpg" alt="YODAKA よだかの星">
        <span>YODAKA よだかの星</span>
        <small>10ページ</small>
      </a>
      <a class="card" href="08-ark-ladder/">
        <img src="08-ark-ladder/pages-small/page_001.jpg" alt="ARK LADDER 軌道の糸">
        <span>ARK LADDER 軌道の糸</span>
        <small>12ページ</small>
      </a>
      <a class="card" href="07-sangetsu-log/">
        <img src="07-sangetsu-log/pages-small/page_001.jpg" alt="SANGETSU-LOG 評価を喰う獣">
        <span>SANGETSU-LOG 評価を喰う獣</span>
        <small>10ページ</small>
      </a>
      <a class="card" href="06-tachiaoi/">
        <img src="06-tachiaoi/pages-small/page_001.jpg" alt="タチアオイのてっぺん">
        <span>タチアオイのてっぺん</span>
        <small>6ページ</small>
      </a>
      <a class="card" href="05-melos-protocol/">
        <img src="05-melos-protocol/pages-small/page_001.jpg" alt="MELOS01・プロトコル">
        <span>MELOS01・プロトコル</span>
        <small>13ページ</small>
      </a>
      <a class="card" href="04-rasyo-gate/">
        <img src="04-rasyo-gate/pages-small/page_001.jpg" alt="RASYO-GATE">
        <span>RASYO-GATE</span>
        <small>14ページ</small>
      </a>
      <a class="card" href="03-restaurant-takeout/">
        <img src="03-restaurant-takeout/pages-small/page_001.jpg" alt="注文の多い料理店：荒野のテイクアウト">
        <span>注文の多い料理店：荒野のテイクアウト</span>
        <small>13ページ</small>
      </a>
      <a class="card" href="02-hakuchumu/">
        <img src="02-hakuchumu/pages-small/page_001.jpg" alt="江戸川乱歩 白昼夢">
        <span>江戸川乱歩 白昼夢</span>
        <small>13ページ</small>
      </a>
      <a class="card" href="01-galaxy-station-requiem/">
        <img src="01-galaxy-station-requiem/pages-small/page_001.jpg" alt="銀河ステーション・レクイエム">
        <span>銀河ステーション・レクイエム</span>
        <small>10ページ</small>
      </a>
    </section>
  </main>
</body>
</html>
